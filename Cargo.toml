[workspace]
resolver = "3"
members = ["crates/generated-secrets-api", "crates/generated-secrets-core", "crates/generated-secrets-operator", "xtask"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jabbas/generated-secrets-operator"
# The declared floor is the toolchain we build and test with (rust-toolchain.toml,
# same major.minor). No crate is published, so there are no downstream users on an
# older Rust to keep working. The MSRV-aware resolver (resolver = "3") keeps
# Cargo.lock inside this floor: a dependency that needs a newer Rust than this
# stays held back. This value and the toolchain pin therefore move together
# (Renovate bumps both in one pull request).
rust-version = "1.99"

[workspace.dependencies]
kube = { version = "5.0", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.29", default-features = false, features = ["v1_34", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the archived serde_yaml.
serde_norway = "0.9"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
thiserror = "2"
zeroize = "1"
tokio = "1"
data-encoding = "2"
# rand_core 0.6 is the version stable `ssh-key` 0.6.x uses; generators take
# its `CryptoRngCore`. `OsRng` (feature `getrandom`) seeds the production RNG.
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
prometheus-client = "0.26"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "json", "env-filter"] }

[profile.dev]
debug = "line-tables-only"   # backtraces keep file:line, much smaller artifacts

[profile.dev.package."*"]
debug = 0                    # no debuginfo for dependencies

[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
